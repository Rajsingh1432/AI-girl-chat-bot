services:
  - type: web
    name: ai-girl-bot
    runtime: python
    # repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME   # अपना रिपो लिंक डालें
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py